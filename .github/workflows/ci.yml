name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 分析、测试与边界检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed packages/reader_core packages/reader_ui apps/reader_mobile

      - name: reader_core 依赖边界
        run: bash tool/check_core_boundary.sh

      - name: 各包分析与测试
        run: bash tool/run_all.sh
