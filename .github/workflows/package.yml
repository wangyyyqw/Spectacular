name: 多平台自动打包

on:
  push:
    branches:
      - ReaMicro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 配置 Android 发布签名
        working-directory: apps/reader_mobile/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REAMICRO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.REAMICRO_RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.REAMICRO_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REAMICRO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "未配置 Android 发布签名，使用 debug 签名构建"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > app/reamicro-release.jks
          {
            printf 'storeFile=reamicro-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > key.properties
          chmod 600 app/reamicro-release.jks key.properties
      - name: 构建 Android Release
        working-directory: apps/reader_mobile
        run: |
          flutter build apk --release --no-pub
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/spectacular-android-universal.apk
      - name: 上传 Android 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-android
          path: apps/reader_mobile/dist/spectacular-android-universal.apk
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($actual -ne '6a19cca56475dbfba1478ee68d7bd0c2ef891da1') {
            throw "Flutter 版本与本地不一致：$actual"
          }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 构建 Windows Release
        working-directory: apps/reader_mobile
        run: |
          flutter build windows --release --no-pub
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/spectacular-windows-x64.zip -Force
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-windows-x64
          path: apps/reader_mobile/dist/spectacular-windows-x64.zip
          retention-days: 14

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 构建 macOS Release
        working-directory: apps/reader_mobile
        run: |
          flutter build macos --release --no-pub
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          test -n "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/spectacular-macos-arm64-unsigned.zip
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-macos-arm64
          path: apps/reader_mobile/dist/spectacular-macos-arm64-unsigned.zip
          retention-days: 14

  ios:
    name: iOS 未签名
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 构建 iOS Release
        working-directory: apps/reader_mobile
        run: |
          flutter build ios --release --no-codesign --no-pub
          test -d build/ios/iphoneos/Runner.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/spectacular-ios-unsigned.zip
      - name: 上传 iOS 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-ios-unsigned
          path: apps/reader_mobile/dist/spectacular-ios-unsigned.zip
          retention-days: 14
