name: 多平台自动打包

on:
  push:
    branches:
      - ReaMicro
  # 保留手动触发；发布 Release 仍需手动勾选。
  workflow_dispatch:
    inputs:
      publish_release:
        description: 发布 ci-latest Release（默认只构建，不发版）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 配置 Android 发布签名
        working-directory: apps/reader_mobile/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REAMICRO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.REAMICRO_RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.REAMICRO_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REAMICRO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "未配置 Android 发布签名，使用 debug 签名构建"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > app/reamicro-release.jks
          {
            printf 'storeFile=reamicro-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > key.properties
          chmod 600 app/reamicro-release.jks key.properties
      - name: 构建 Android Release
        run: tool/build_apk.sh --allow-downloads
      - name: 上传 Android 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-android-arm64
          path: apps/reader_mobile/dist/spectacular-reader-release.apk
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($actual -ne '6a19cca56475dbfba1478ee68d7bd0c2ef891da1') {
            throw "Flutter 版本与本地不一致：$actual"
          }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 构建 Windows Release
        working-directory: apps/reader_mobile
        run: |
          flutter build windows --release --no-pub
          New-Item -ItemType Directory -Force dist/windows-x64 | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/windows-x64 -Recurse -Force
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-windows-x64
          path: apps/reader_mobile/dist/windows-x64/
          retention-days: 14

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 构建 macOS Release
        working-directory: apps/reader_mobile
        run: |
          flutter build macos --release --no-pub
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          test -n "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/spectacular-macos-arm64-unsigned.zip
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-macos-arm64
          path: apps/reader_mobile/dist/spectacular-macos-arm64-unsigned.zip
          retention-days: 14

  ios:
    name: iOS 未签名
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [ "$actual" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
            echo "Flutter 版本与本地不一致：$actual" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 选择支持 iOS 26 SDK 的 Xcode
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: 构建 iOS Release
        working-directory: apps/reader_mobile
        run: |
          flutter build ios --release --no-codesign --no-pub
          test -d build/ios/iphoneos/Runner.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/spectacular-ios-unsigned.zip
      - name: 上传 iOS 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-ios-unsigned
          path: apps/reader_mobile/dist/spectacular-ios-unsigned.zip
          retention-days: 14

  download-hint:
    name: 下载说明
    needs:
      - android
      - windows
      - macos
      - ios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 写入运行摘要
        shell: bash
        run: |
          {
            echo '## 构建产物下载'
            echo ''
            echo 'Actions 网页下载的 artifact 会由 GitHub 再包一层 ZIP。'
            echo '使用下面的命令可自动解压，直接得到下列文件：'
            echo ''
            echo '```bash'
            echo "gh run download ${GITHUB_RUN_ID}"
            echo '```'
            echo ''
            echo '- `spectacular-reader-release.apk`：Android 安装包'
            echo '- `spectacular-windows-x64/`：Windows 应用目录，网页下载解压一次即得到 exe'
            echo '- `spectacular-macos-arm64-unsigned.zip`：macOS 应用，解压一次即可'
            echo '- `spectacular-ios-unsigned.zip`：iOS 应用，解压一次即可'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 发布 CI 产物
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs:
      - android
      - windows
      - macos
      - ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
      - name: 检查发布文件
        shell: bash
        run: |
          set -euo pipefail
          test -f release/spectacular-android-arm64/spectacular-reader-release.apk
          test -f release/spectacular-windows-x64/reader_mobile.exe
          test -f release/spectacular-macos-arm64/spectacular-macos-arm64-unsigned.zip
          test -f release/spectacular-ios-unsigned/spectacular-ios-unsigned.zip
          cp release/spectacular-android-arm64/spectacular-reader-release.apk release/
          cp release/spectacular-macos-arm64/spectacular-macos-arm64-unsigned.zip release/
          cp release/spectacular-ios-unsigned/spectacular-ios-unsigned.zip release/
          (cd release/spectacular-windows-x64 && zip -qr ../spectacular-windows-x64.zip .)
          unzip -l release/spectacular-windows-x64.zip | grep -q 'reader_mobile.exe'
          if unzip -Z1 release/spectacular-windows-x64.zip | grep -q '^spectacular-windows-x64/'; then
            echo 'Windows 发布包仍包含多余目录层' >&2
            exit 1
          fi
          ls -lh release
      - name: 发布滚动 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ci-latest
        run: |
          set -euo pipefail
          notes="分支 ${GITHUB_REF_NAME} 的最新多平台构建。提交 ${GITHUB_SHA}。工作流运行 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "CI 最新构建（${GITHUB_REF_NAME}）" \
              --notes "$notes" \
              --prerelease
            gh release upload "$TAG" release/*.apk release/*.zip --clobber
          else
            gh release create "$TAG" release/*.apk release/*.zip \
              --target "$GITHUB_SHA" \
              --title "CI 最新构建（${GITHUB_REF_NAME}）" \
              --notes "$notes" \
              --prerelease
          fi
