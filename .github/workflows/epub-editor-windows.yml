name: EPUB 编辑器 Windows 验收
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备与本地一致的 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($actual -ne '6a19cca56475dbfba1478ee68d7bd0c2ef891da1') { throw 'Flutter 版本与本地不一致' }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 准备依赖
        working-directory: apps/reader_mobile
        run: flutter pub get
      - name: 运行 Windows 桌面交互回归
        working-directory: apps/reader_mobile
        run: flutter test --no-pub --concurrency=1 test/home/bookshelf_desktop_input_test.dart test/home/bookshelf_responsive_test.dart test/editing/book_editor_shortcuts_test.dart test/editing/book_editor_save_test.dart
      - name: 运行 Windows 首页实际窗口测试
        working-directory: apps/reader_mobile
        run: flutter test --no-pub -d windows integration_test/desktop_home_features_test.dart
      - name: 运行 Windows 编辑器实际窗口测试
        working-directory: apps/reader_mobile
        run: flutter test --no-pub -d windows integration_test/epub_editor_desktop_test.dart
      - name: 构建 Windows Release
        working-directory: apps/reader_mobile
        run: flutter build windows --release --no-pub
      - name: 保存可运行产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectacular-windows-editor
          path: apps/reader_mobile/build/windows/x64/runner/Release/
          retention-days: 7
